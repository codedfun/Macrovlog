<body>
<title>Recomp Macro Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a single phone-first column; summary at top, meals below, editor as a bottom sheet. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e9edf2; --ink:#121720; --muted:#5a6472; --line:#d9dfe7;
  --accent:#2347d6; --accent-ink:#ffffff;
  --pro:#cf4336; --carb:#b97d0c; --fat:#16857b;
  --ok:#2b7a4b; --warn:#b4530a; --bad:#b42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#161a20; --sunk:#1d222a; --ink:#e7ebf0; --muted:#98a2b0; --line:#2a313b;
  --accent:#7d95ff; --accent-ink:#0e1115;
  --pro:#ff7b6c; --carb:#efb440; --fat:#47c3b6;
  --ok:#5dc489; --warn:#f3a15c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#161a20; --sunk:#1d222a; --ink:#e7ebf0; --muted:#98a2b0; --line:#2a313b;
  --accent:#7d95ff; --accent-ink:#0e1115;
  --pro:#ff7b6c; --carb:#efb440; --fat:#47c3b6;
  --ok:#5dc489; --warn:#f3a15c; --bad:#ff8a80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .label{font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
.iconbtn:disabled{opacity:.35;cursor:default}

.kcal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kcal .big{font-size:52px;line-height:.9;font-weight:700}
.kcal .of{font-size:20px;color:var(--muted);font-weight:500}
.kcal .left{text-align:right}
.kcal .left .num{font-size:28px;font-weight:600;line-height:1}
.track{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;position:relative}
.track>i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ink)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macro{display:flex;flex-direction:column;gap:6px;min-width:0}
.macro .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:4px}
.macro .val{font-size:24px;font-weight:600;line-height:1}
.macro .val small{font-size:15px;color:var(--muted);font-weight:500}
.macro .rem{font-size:12.5px;color:var(--muted)}
.macro.pro .track>i{background:var(--pro)} .macro.carb .track>i{background:var(--carb)} .macro.fat .track>i{background:var(--fat)}
.over{color:var(--warn)!important;font-weight:600}
.tip{font-size:13.5px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.tip b{color:var(--pro)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}

.meals{display:flex;flex-direction:column;gap:10px}
.meal{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.meal .thumb{width:56px;height:56px;border-radius:9px;background:var(--sunk);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:20px}
.meal .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meal .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .items{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chips span b{font-weight:600}
.chips .p b{color:var(--pro)} .chips .c b{color:var(--carb)} .chips .f b{color:var(--fat)}
.meal .k{font-family:var(--display);font-size:20px;font-weight:600;flex:none;text-align:right}
.meal .k small{display:block;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}

.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk)}
.banner .btn{padding:8px 12px}
.note{font-size:12.5px;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
textarea{resize:vertical;min-height:62px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.inline{display:flex;gap:8px}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.calc div{background:var(--sunk);border-radius:10px;padding:10px 4px}
.calc .num{font-size:24px;font-weight:600;display:block;line-height:1.1}
.calc .t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.how{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.how b{color:var(--ink);font-weight:600}

/* weight */
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wstats div{display:flex;flex-direction:column;gap:2px}
.wstats .num{font-size:28px;font-weight:600;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--sunk)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.idle{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.wlist{display:flex;flex-direction:column}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow button{border:0;background:transparent;color:var(--muted);padding:4px 8px;font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(8 10 14/.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;border-radius:18px 18px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.photo{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:12px;padding:12px}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px}
.photo .row{display:flex;gap:8px;flex-wrap:wrap}
.photo .row .btn{flex:1;min-width:140px}
.status{font-size:13.5px}
.status.err{color:var(--bad)}
.status.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.status.busy::before{animation:none}}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .r1{display:flex;gap:8px;align-items:center}
.item .r1 input{flex:1}
.item .x{border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;flex:none}
.item .r2{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr .9fr;gap:6px;align-items:end}
.item .r2 label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item .r2 input{padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums}
.item .r2 .kc{font-family:var(--display);font-size:18px;font-weight:600;text-align:center;padding-bottom:6px}
.item .src{font-size:11.5px;color:var(--muted)}
.search{position:relative;display:flex;flex-direction:column;gap:6px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:9px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.results button:first-child{border-top:0}
.results button span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.totals{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.totals .num{font-size:26px;font-weight:600}
.sheet footer{display:flex;gap:10px;flex-wrap:wrap}
.sheet footer .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:420px){
  .kcal .big{font-size:44px}
  .item .r2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item .r2 .g{grid-column:span 2}
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <h1>Recomp Log</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-today" data-view="today" aria-selected="true">Today</button>
      <button role="tab" id="tab-weight" data-view="weight" aria-selected="false">Weight</button>
      <button role="tab" id="tab-targets" data-view="targets" aria-selected="false">Targets</button>
    </nav>
  </header>
  <div id="note" class="note" hidden></div>
  <main id="view"><div class="panel"><p class="muted">Loading your log…</p></div></main>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" hidden>

<script>
(() => {
"use strict";
const LB = 0.45359237;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1 = n => Math.round((+n || 0) * 10) / 10;
const r5 = n => Math.round(n / 5) * 5;
const kcalOf = (p, c, f) => 4 * (+p || 0) + 4 * (+c || 0) + 9 * (+f || 0);
const fmt = n => Math.round(n).toLocaleString();
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Per 100 g, from USDA FoodData Central reference values (cooked weight where noted). */
const FOODS = [
  ["Chicken breast, cooked", 31, 0, 3.6, 150, "1 breast ≈ 150 g"],
  ["Chicken thigh, cooked, skinless", 26, 0, 8.2, 100, "1 thigh ≈ 100 g"],
  ["Ground beef 90/10, cooked", 26.1, 0, 11.7, 113, "4 oz cooked"],
  ["Sirloin steak, lean, cooked", 30, 0, 6, 170, "6 oz cooked"],
  ["Ground turkey 93/7, cooked", 27.1, 0, 9.9, 113, "4 oz cooked"],
  ["Pork tenderloin, cooked", 26.2, 0, 3.5, 113, "4 oz cooked"],
  ["Salmon, cooked", 22.1, 0, 12.4, 140, "1 fillet ≈ 140 g"],
  ["Tuna, canned in water, drained", 23.6, 0, 0.9, 113, "1 can drained"],
  ["Shrimp, cooked", 24, 0.2, 0.3, 100, "≈ 12 large"],
  ["Egg, whole", 12.6, 0.7, 9.5, 50, "1 large egg = 50 g"],
  ["Egg whites", 10.9, 0.7, 0.2, 243, "1 cup"],
  ["Greek yogurt, nonfat plain", 10.3, 3.6, 0.4, 170, "1 container"],
  ["Cottage cheese, 2%", 10.5, 4.8, 2.3, 113, "½ cup"],
  ["Milk, 2%", 3.3, 4.8, 2, 244, "1 cup"],
  ["Whey protein powder", 78, 8, 5, 31, "1 scoop ≈ 31 g"],
  ["Tofu, firm", 17.3, 2.8, 8.7, 126, "½ cup"],
  ["Cheddar cheese", 24.9, 1.3, 33.1, 28, "1 oz"],
  ["White rice, cooked", 2.7, 28.2, 0.3, 158, "1 cup"],
  ["Brown rice, cooked", 2.6, 23, 0.9, 195, "1 cup"],
  ["Rolled oats, dry", 13.2, 67.7, 6.5, 40, "½ cup dry"],
  ["Pasta, cooked", 5.8, 30.9, 0.9, 140, "1 cup"],
  ["Quinoa, cooked", 4.4, 21.3, 1.9, 185, "1 cup"],
  ["Potato, baked with skin", 2.5, 21.2, 0.1, 173, "1 medium"],
  ["Sweet potato, baked", 2, 20.7, 0.2, 114, "1 medium"],
  ["Whole wheat bread", 12.3, 43.1, 3.5, 32, "1 slice"],
  ["Tortilla, flour", 8.3, 49.4, 7.8, 45, "1 medium (8 in)"],
  ["Black beans, cooked", 8.9, 23.7, 0.5, 172, "1 cup"],
  ["Lentils, cooked", 9, 20.1, 0.4, 198, "1 cup"],
  ["Banana", 1.1, 22.8, 0.3, 118, "1 medium"],
  ["Apple", 0.3, 13.8, 0.2, 182, "1 medium"],
  ["Blueberries", 0.7, 14.5, 0.3, 148, "1 cup"],
  ["Strawberries", 0.7, 7.7, 0.3, 152, "1 cup"],
  ["Broccoli, cooked", 2.4, 7.2, 0.4, 156, "1 cup"],
  ["Spinach, raw", 2.9, 3.6, 0.4, 30, "1 cup"],
  ["Mixed vegetables, cooked", 2.6, 13.1, 0.2, 182, "1 cup"],
  ["Avocado", 2, 8.5, 14.7, 68, "½ avocado"],
  ["Olive oil", 0, 0, 100, 13.5, "1 tbsp"],
  ["Butter", 0.9, 0.1, 81.1, 14, "1 tbsp"],
  ["Peanut butter", 22.5, 22.3, 51.4, 32, "2 tbsp"],
  ["Almonds", 21.2, 21.6, 49.9, 28, "1 oz ≈ 23 nuts"],
  ["Hummus", 7.9, 14.3, 9.6, 30, "2 tbsp"],
];

const state = {
  view: "today", dayKey: keyOf(new Date()), settings: undefined, weights: [], day: null,
  loaded: { settings: false, day: false }, remote: false, sample: null, sampleImages: false,
  editor: null, draft: null,
};
const photoCache = {};

/* ---------- storage: shared db when available, this browser otherwise ---------- */
let backend;
function localBackend() {
  const L = {};
  const read = k => { try { const v = localStorage.getItem("recomp:" + k); return v ? JSON.parse(v) : null; } catch { return null; } };
  return {
    sub(k, cb) { L[k] = cb; cb(read(k)); return () => { if (L[k] === cb) delete L[k]; }; },
    async get(k) { return read(k); },
    async set(k, d) { try { localStorage.setItem("recomp:" + k, JSON.stringify(d)); } catch { toast("This browser is out of space, so that wasn't saved."); } L[k]?.(d); },
    async del(k) { try { localStorage.removeItem("recomp:" + k); } catch {} L[k]?.(null); },
  };
}
function remoteBackend(db, id) {
  const col = db.collection("data/users/" + id);
  const pending = {}, busy = {};
  async function flush(k) {
    if (busy[k]) return; busy[k] = true;
    while (k in pending) {
      const d = pending[k]; delete pending[k];
      try { d === null ? await col.doc(k).delete() : await col.doc(k).set(d); }
      catch (e) { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete some old photos to keep saving." : "Couldn't save. Check your connection and try again."); }
    }
    busy[k] = false;
  }
  return {
    sub(k, cb) { return col.doc(k).onSnapshot(s => cb(s.exists ? structuredClone(s.data()) : null, s.metadata), () => showNote("Your log can't be reached right now. Changes may not be saved.")); },
    async get(k) { const s = await col.doc(k).get(); return s.exists ? s.data() : null; },
    set(k, d) { pending[k] = d; return flush(k); },
    del(k) { pending[k] = null; return flush(k); },
  };
}
function showNote(t) { const n = $("#note"); n.textContent = t || ""; n.hidden = !t; }

let unDay = null, loadTimer = null;
function subDay() {
  unDay?.(); state.day = null; state.loaded.day = false;
  const key = state.dayKey;
  unDay = backend.sub("d-" + key, v => {
    if (key !== state.dayKey) return;
    state.day = v || { entries: [] }; state.loaded.day = true; render();
  });
}

async function init() {
  let db = null, user = null, id = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); id = user ? await user.id() : null; } catch {}
    claude.use("sample").then(async s => {
      if (!s) return;
      const lim = await s.limits().catch(() => null);
      state.sample = s; state.sampleImages = !!lim?.images;
      if (state.editor) renderSheet();
    }).catch(() => {});
  }
  state.remote = !!(db && id);
  backend = state.remote ? remoteBackend(db, id) : localBackend();
  if (state.remote) loadTimer = setTimeout(() => { if (!state.loaded.settings) showNote("Your log can't be reached yet. It will appear when the connection returns."); }, 10000);
  else showNote("Saved in this browser only.");
  backend.sub("settings", (v, meta) => {
    state.settings = v; state.loaded.settings = true;
    if (!meta || !meta.fromCache) { clearTimeout(loadTimer); if (state.remote) showNote(""); }
    if (!v && state.view === "today" && !state.draft) state.view = "targets";
    render();
  });
  backend.sub("weights", v => { state.weights = (v?.list || []).slice().sort((a, b) => a.d < b.d ? -1 : 1); render(); });
  subDay();
}

/* ---------- targets ---------- */
const ACT = [[1.2, "Desk job, lifting 0–2×/week"], [1.375, "Lifting 3–4×/week, light daily movement"], [1.55, "Lifting 4–5×/week plus an active job or 8k+ steps"], [1.725, "Hard training most days and a physical job"]];
const PACE = [[0.1, "Gentle", "−10%"], [0.2, "Steady", "−20%"], [0.25, "Aggressive", "−25%"]];
function calc(p) {
  const bmr = 10 * p.kg + 6.25 * p.cm - 5 * p.age + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * p.act;
  let kcal = tdee * (1 - p.pace);

  const protein = r5(2.2 * (p.goalKg || p.kg));
  const fat = r5(Math.max(0.25 * kcal / 9, 0.6 * p.kg));
  const carbs = Math.max(0, r5((kcal - protein * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee / 10) * 10, protein, carbs, fat, kcal: kcalOf(protein, carbs, fat) };
}
function targets() { const t = state.settings?.targets; return t ? { ...t, kcal: kcalOf(t.p, t.c, t.f) } : null; }

/* ---------- render ---------- */
function render() {

function dayTotals(day) {
  const t = { p: 0, c: 0, f: 0 };
  for (const e of day?.entries || []) for (const i of e.items) { t.p += +i.p || 0; t.c += +i.c || 0; t.f += +i.f || 0; }
  t.k = kcalOf(t.p, t.c, t.f); return t;
}

/* ---------- weight view ---------- */
function weightStats(list) {
  if (!list.length) return null;
  const last = dateOf(list[list.length - 1].d);
  const daysAgo = k => Math.round((last - dateOf(k)) / 864e5);
  const win = (a, b) => { const xs = list.filter(w => { const n = daysAgo(w.d); return n >= a && n <= b; }).map(w => w.kg); return xs.length ? { avg: xs.reduce((s, x) => s + x, 0) / xs.length, n: xs.length } : null; };
  const cur = win(0, 6), prev = win(7, 13);
  let rate = null; if (cur && prev && cur.n >= 2 && prev.n >= 2) rate = (cur.avg - prev.avg) / prev.avg * 100;
  return { latest: list[list.length - 1].kg, avg: cur?.avg, change: rate == null ? null : cur.avg - prev.avg, rate };
}

    else { pill = `<span class="pill warn">Stalled</span>`; advice = "If the average holds flat for two weeks in a row, cut about 150 kcal a day (from carbs or fat, not protein) or add a daily walk. A flat scale with a shrinking waist means recomposition is working, so measure your waist too."; }
  }

  $("#view").innerHTML = `
  <section class="panel">
    <h2>Weight trend</h2>

    ${st ? `<div class="wstats">

  ${list.length ? `<section class="panel"><h2>Weigh-ins</h2><div class="wlist">${list.slice().reverse().slice(0, 30).map(w => `<div class="wrow"><span>${esc(dateOf(w.d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }))}</span><span><b class="num" style="font-size:18px">${r1(conv(w.kg))}</b> ${u}<button data-del="${w.d}" aria-label="Delete weigh-in">Delete</button></span></div>`).join("")}</div></section>` : ""}`;
  $("#wform").onsubmit = e => {

    const val = +$("#wIn").value; if (!(val > 0)) { toast(`Enter your weight in ${u}.`); return; }

function chart(list, conv, u) {
  const pts = list.slice(-42), W = 520, H = 170, L = 40, R = 10, T = 10, B = 24;
  const t0 = dateOf(pts[0].d).getTime(), t1 = dateOf(pts[pts.length - 1].d).getTime(), span = Math.max(1, t1 - t0);
  const vals = pts.map(p => conv(p.kg)); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const x = d => L + (dateOf(d).getTime() - t0) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const avg = pts.map(p => { const t = dateOf(p.d).getTime(); const w = pts.filter(q => { const s = dateOf(q.d).getTime(); return s <= t && s > t - 7 * 864e5; }); return [x(p.d), y(w.reduce((a, q) => a + conv(q.kg), 0) / w.length)]; });
  const ticks = [lo, (lo + hi) / 2, hi];
  const lbl = d => dateOf(d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time with 7-day average">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${r1(v)}</text>`).join("")}
    <polyline points="${avg.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(p.d)}" cy="${y(vals[i])}" r="3" fill="var(--muted)" opacity=".7"/>`).join("")}
    <circle cx="${avg[avg.length - 1][0]}" cy="${avg[avg.length - 1][1]}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${lbl(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${lbl(pts[pts.length - 1].d)}</text>
  </svg><div class="small muted">Dots: daily weigh-ins (${u}). Line: 7-day average.</div>`;
}

function defaultName() { const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 17 ? "Snack" : "Dinner"; }
function openEditor(id) {
  const e = id ? state.day.entries.find(x => x.id === id) : null;
  state.editor = e
    ? { id: e.id, t: e.t, name: e.name, items: structuredClone(e.items), photo: photoCache[e.id] || null, hadPhoto: !!e.photo, photoChanged: false, aiBlob: null, notes: "", status: "", statusKind: "", query: "" }
    : { id: null, t: null, name: defaultName(), items: [], photo: null, hadPhoto: false, photoChanged: false, aiBlob: null, notes: "", status: "", statusKind: "", query: "" };
  if (e?.photo && !photoCache[e.id]) backend.get("p-" + e.id).then(d => { if (d?.img && state.editor?.id === e.id) { photoCache[e.id] = d.img; state.editor.photo = d.img; renderSheet(); } }).catch(() => {});
  renderSheet();
}
function closeEditor() { state.editor = null; document.querySelector(".scrim")?.remove(); document.body.style.overflow = ""; }
function renderSheet() {
  const E = state.editor; if (!E) return;
  let scrim = document.querySelector(".scrim");
  const scroll = scrim?.querySelector(".sheet")?.scrollTop || 0;
  const focusId = document.activeElement?.id; const selStart = document.activeElement?.selectionStart;
  if (!scrim) { scrim = document.createElement("div"); scrim.className = "scrim"; document.body.appendChild(scrim); document.body.style.overflow = "hidden"; scrim.addEventListener("click", ev => { if (ev.target === scrim) closeEditor(); }); }
  const aiOk = !!state.sample;
  const t = { p: 0, c: 0, f: 0 }; E.items.forEach(i => { t.p += +i.p || 0; t.c += +i.c || 0; t.f += +i.f || 0; });
  const q = E.query.trim().toLowerCase();
  const res = q ? FOODS.filter(f => q.split(/\s+/).every(w => f[0].toLowerCase().includes(w))).slice(0, 8) : [];
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <header><h2 id="shTitle">${E.id ? "Edit meal" : "Log a meal"}</h2><button class="iconbtn" id="shClose" aria-label="Close">✕</button></header>
    <div class="field"><label for="mName">Meal</label><input id="mName" value="${esc(E.name)}"></div>
    <div class="photo">
      ${E.photo ? `<img src="${E.photo}" alt="Meal photo">` : ""}
      <div class="row">
        <label class="btn" for="camIn">${ICON_CAM}${E.photo ? "Retake" : "Take photo"}</label>
        <label class="btn" for="libIn">Choose photo</label>
        ${E.photo ? `<button class="btn danger" id="rmPhoto" type="button">Remove photo</button>` : ""}
      </div>
      ${aiOk ? `<div class="field"><label for="mNotes">Details for a better estimate (optional)</label><textarea id="mNotes" placeholder="e.g. 6 oz grilled chicken, 1 cup rice, cooked in 1 tbsp olive oil">${esc(E.notes)}</textarea></div>
      <button class="btn primary" id="estBtn" type="button" ${(E.photo && state.sampleImages && E.aiBlob) || E.notes.trim() ? "" : "disabled"}>Estimate macros${E.photo && E.aiBlob && state.sampleImages ? " from photo" : " from description"}</button>`
      : `<p class="small muted" style="margin:0">Photos are saved with the meal. Automatic estimates from photos need this page opened in Claude.</p>`}
      ${E.status ? `<div class="status ${E.statusKind}" role="status">${esc(E.status)}</div>` : ""}
    </div>
    <div class="items">
      <span class="flabel">Foods</span>
      ${E.items.length ? E.items.map((i, n) => `<div class="item" data-i="${n}">
        <div class="r1"><input id="in${n}" value="${esc(i.name)}" aria-label="Food name"><button class="x" data-rm="${n}" aria-label="Remove ${esc(i.name)}">×</button></div>
        <div class="r2">
          <div class="field g"><label for="ig${n}">Grams</label><input id="ig${n}" type="number" inputmode="decimal" value="${r1(i.g)}"></div>
          <div class="field"><label for="ip${n}" style="color:var(--pro)">Protein</label><input id="ip${n}" type="number" inputmode="decimal" value="${r1(i.p)}"></div>
          <div class="field"><label for="ic${n}" style="color:var(--carb)">Carbs</label><input id="ic${n}" type="number" inputmode="decimal" value="${r1(i.c)}"></div>
          <div class="field"><label for="if${n}" style="color:var(--fat)">Fat</label><input id="if${n}" type="number" inputmode="decimal" value="${r1(i.f)}"></div>
          <div class="kc" id="ik${n}">${fmt(kcalOf(i.p, i.c, i.f))}<span class="small muted"> kcal</span></div>
        </div>
        ${i.hint ? `<div class="src">${esc(i.hint)}</div>` : ""}
      </div>`).join("") : `<div class="empty">No foods yet. Take a photo, or search below.</div>`}
    </div>
    <div class="search">
      <label class="flabel" for="fq">Add a food</label>
      <input id="fq" value="${esc(E.query)}" placeholder="Search: chicken, rice, eggs, oats…" autocomplete="off">
      ${q ? `<div class="results">${res.map(f => `<button type="button" data-food="${esc(f[0])}"><span>${esc(f[0])}</span><span>${esc(f[5])}</span></button>`).join("")}<button type="button" id="addCustom"><span>Add “${esc(E.query.trim())}” and enter macros from the label</span><span></span></button></div>` : ""}
      <p class="small muted" style="margin:0">Changing grams rescales that food's macros. For packaged food, copy the label's numbers.</p>
    </div>
    <div class="totals"><span class="chips"><span class="p"><b>${Math.round(t.p)}</b> g P</span><span class="c"><b>${Math.round(t.c)}</b> g C</span><span class="f"><b>${Math.round(t.f)}</b> g F</span></span><span><span class="num" id="tk">${fmt(kcalOf(t.p, t.c, t.f))}</span> kcal</span></div>
    <footer>
      ${E.id ? `<button class="btn danger" id="delMeal" type="button">Delete</button>` : ""}
      <button class="btn ghost" id="cancel" type="button">Cancel</button>
      <button class="btn primary" id="save" type="button" ${E.items.length ? "" : "disabled"}>Save meal</button>
    </footer></div>`;
  const sheet = scrim.querySelector(".sheet"); sheet.scrollTop = scroll;
  if (focusId && document.getElementById(focusId)) { const el = document.getElementById(focusId); el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} }
  $("#shClose").onclick = closeEditor; $("#cancel").onclick = closeEditor;
  $("#mName").oninput = e => E.name = e.target.value;
  $("#mNotes")?.addEventListener("input", e => { E.notes = e.target.value; const b = $("#estBtn"); const hasImg = E.photo && E.aiBlob && state.sampleImages; b.disabled = !(hasImg || E.notes.trim()); });
  $("#estBtn")?.addEventListener("click", estimate);
  $("#rmPhoto")?.addEventListener("click", () => { E.photo = null; E.aiBlob = null; E.photoChanged = true; renderSheet(); });
  $("#fq").oninput = e => { E.query = e.target.value; renderSheet(); };
  sheet.querySelectorAll("[data-food]").forEach(b => b.onclick = () => {
    const f = FOODS.find(x => x[0] === b.dataset.food), g = f[4];
    E.items.push({ name: f[0], g, p: f[1] * g / 100, c: f[2] * g / 100, f: f[3] * g / 100, hint: `Serving: ${f[5]}. USDA values per 100 g: ${f[1]} P · ${f[2]} C · ${f[3]} F` });
    E.query = ""; renderSheet();
  });
  $("#addCustom")?.addEventListener("click", () => { E.items.push({ name: E.query.trim(), g: 100, p: 0, c: 0, f: 0, hint: "Enter grams and macros from the nutrition label." }); E.query = ""; renderSheet(); });
  sheet.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { E.items.splice(+b.dataset.rm, 1); renderSheet(); });
  sheet.querySelectorAll(".item").forEach(row => {
    const n = +row.dataset.i, it = E.items[n];
    row.querySelector(`#in${n}`).oninput = e => it.name = e.target.value;
    row.querySelector(`#ig${n}`).oninput = e => {
      const g = +e.target.value;
      if (it.g > 0 && g >= 0) { const k = g / it.g; it.p *= k; it.c *= k; it.f *= k; ["p", "c", "f"].forEach(m => row.querySelector(`#i${m}${n}`).value = r1(it[m])); }
      it.g = g; updTotals();
    };
    ["p", "c", "f"].forEach(m => row.querySelector(`#i${m}${n}`).oninput = e => { it[m] = +e.target.value || 0; updTotals(); });
    function updTotals() {
      row.querySelector(`#ik${n}`).innerHTML = `${fmt(kcalOf(it.p, it.c, it.f))}<span class="small muted"> kcal</span>`;
      const t = { p: 0, c: 0, f: 0 }; E.items.forEach(i => { t.p += +i.p || 0; t.c += +i.c || 0; t.f += +i.f || 0; });
      sheet.querySelector(".totals .chips").innerHTML = `<span class="p"><b>${Math.round(t.p)}</b> g P</span><span class="c"><b>${Math.round(t.c)}</b> g C</span><span class="f"><b>${Math.round(t.f)}</b> g F</span>`;
      $("#tk").textContent = fmt(kcalOf(t.p, t.c, t.f));
    }
  });
  $("#save").onclick = saveMeal;
  $("#delMeal")?.addEventListener("click", ev => {
    const b = ev.currentTarget; if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; }
    const id = E.id; const day = structuredClone(state.day); day.entries = day.entries.filter(x => x.id !== id);
    state.day = day; backend.set("d-" + state.dayKey, day); if (E.hadPhoto) backend.del("p-" + id); delete photoCache[id];
    closeEditor(); toast("Meal deleted"); render();
  });
}
async function saveMeal() {
  const E = state.editor; if (!E) return;
  const items = E.items.filter(i => i.name.trim() || i.p || i.c || i.f).map(i => ({ name: i.name.trim() || "Food", g: r1(i.g), p: r1(i.p), c: r1(i.c), f: r1(i.f) }));
  if (!items.length) { toast("Add at least one food."); return; }
  const id = E.id || uid();
  let t = E.t;
  if (!t) { const d = dateOf(state.dayKey), now = new Date(); d.setHours(now.getHours(), now.getMinutes()); t = d.getTime(); }
  const hasPhoto = E.photoChanged ? !!E.photo : E.hadPhoto;
  const entry = { id, t, name: E.name.trim() || "Meal", items, photo: hasPhoto };
  const day = structuredClone(state.day || { entries: [] });
  const ix = day.entries.findIndex(x => x.id === id); ix >= 0 ? day.entries[ix] = entry : day.entries.push(entry);
  state.day = day;
  if (E.photoChanged) { if (E.photo) { photoCache[id] = E.photo; backend.set("p-" + id, { img: E.photo, day: state.dayKey }); } else { delete photoCache[id]; if (E.hadPhoto) backend.del("p-" + id); } }
  backend.set("d-" + state.dayKey, day);
  closeEditor(); toast(ix >= 0 ? "Meal updated" : "Meal logged"); render();
}

/* photos: one small copy to keep, one larger copy for the estimate */
async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
}
function scaled(img, max) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c;
}
async function onPhoto(file) {
  if (!file) return;
  if (!state.editor) openEditor(null);
  const E = state.editor;
  E.status = "Reading photo…"; E.statusKind = "busy"; renderSheet();
  try {
    const img = await loadImage(file);
    E.photo = scaled(img, 420).toDataURL("image/jpeg", 0.72);
    E.aiBlob = await new Promise(r => scaled(img, 1280).toBlob(r, "image/jpeg", 0.85));
    E.photoChanged = true; E.status = ""; E.statusKind = "";
    renderSheet();
    if (state.sample && state.sampleImages && !E.items.length) estimate();
  } catch { E.status = "That photo couldn't be opened. Try a JPEG or PNG."; E.statusKind = "err"; renderSheet(); }
}
["#camIn", "#libIn"].forEach(s => $(s).addEventListener("change", e => { const f = e.target.files?.[0]; e.target.value = ""; pendingQuick = false; onPhoto(f); }));

const ERR = {
  not_granted: "Estimates are turned off for this page. You can still enter foods yourself.",
  rate_limited: "Too many estimates in a short time. Wait a minute and try again.",
  image_rejected: "That photo couldn't be sent. Try a JPEG or PNG.",
  images_unavailable: "Photo estimates aren't available here. Describe the meal instead.",
  cancelled: "Estimate cancelled.",
};
async function estimate() {
  const E = state.editor; if (!E || !state.sample) return;
  const usePhoto = !!(E.photo && E.aiBlob && state.sampleImages);
  E.status = usePhoto ? "Estimating portions and macros from your photo…" : "Estimating macros from your description…"; E.statusKind = "busy"; renderSheet();
  const prompt = `You are a careful sports nutritionist estimating a meal for someone tracking macros to lose fat while gaining muscle. ${usePhoto ? "The attached image is a photo of the meal." : "There is no photo; use the description."}
${E.notes.trim() ? `The person's own notes (treat stated weights and amounts as exact and use them over what you see): """${E.notes.trim().slice(0, 600)}"""` : "The person gave no notes."}
Instructions:
- List each distinct food separately. Include cooking oil, butter, sauces, dressings and drinks you can see or that are very likely used, as their own items.
- Estimate the edible weight in grams of each item as served (cooked weight for cooked foods). Judge size from the plate (a dinner plate is about 26 cm across), utensils, hands and packaging.
- Use USDA FoodData Central values for protein, carbohydrate and fat in grams for that weight.
- When unsure about a portion, pick the most likely amount rather than the smallest.
Reply with JSON only, in this shape:
{"items":[{"name":"Grilled chicken breast","grams":170,"protein":52.7,"carbs":0,"fat":6.1}],"confidence":"low|medium|high","note":"one short sentence on what was hardest to judge"}`;
  try {
    const out = await state.sample.json(prompt, usePhoto ? { images: [E.aiBlob], modelTier: "default" } : { modelTier: "default" });
    if (state.editor !== E) return;
    const items = Array.isArray(out?.items) ? out.items : [];
    const clean = items.map(i => ({ name: String(i.name || "Food").slice(0, 80), g: Math.max(0, +i.grams || 0), p: Math.max(0, +i.protein || 0), c: Math.max(0, +i.carbs || 0), f: Math.max(0, +i.fat || 0), hint: `Estimated${usePhoto ? " from photo" : ""}. Weigh it or adjust grams if you know better.` })).filter(i => i.p + i.c + i.f > 0 || i.g > 0);
    if (!clean.length) { E.status = "No food was recognized. Add details or search the food list."; E.statusKind = "err"; renderSheet(); return; }
    E.items = clean;
    const conf = ["low", "medium", "high"].includes(out.confidence) ? out.confidence : "medium";
    E.status = `Estimate ready (${conf} confidence). ${out.note ? String(out.note).slice(0, 200) + " " : ""}Check the grams before saving; photo estimates are usually within 20%.`;
    E.statusKind = "";
  } catch (e) {
    if (state.editor !== E) return;
    E.status = ERR[e?.code] || "The estimate didn't come back. Try again, or enter foods yourself."; E.statusKind = "err";
    if (e?.code === "not_granted") state.sample = null;
  }
  renderSheet();
}

let toastTimer;
function toast(t) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.editor) closeEditor(); });

init();
})();
</script>

</body>
</html>
